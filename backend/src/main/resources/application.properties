spring.application.name=blood-donation
server.port=8081

# Database Configuration (Defaults to embedded H2 file database for reliable zero-crash local execution)
# To connect to Supabase PostgreSQL, set SPRING_DATASOURCE_URL or reset database password in Supabase Dashboard
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/blooddonationdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo Data Initializer
app.init-demo-data=true

# Supabase API Configuration
supabase.url=https://lcjbjksulbwklizjtlto.supabase.co
supabase.api.key=sb_publishable_bJBM5vGzxqDqFvsRXxSKug_SBsukAdS

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081}

