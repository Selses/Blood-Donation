services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: blood-donation-backend
    env: java
    region: oregon
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: cd backend && java -jar target/blood-donation-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/test
    autoDeploy: true

  # 2. React Vite Frontend Static Site
  - type: web
    name: blood-donation-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      # SPA rewrite rule so React Router works on page refreshes
      - type: rewrite
        source: /*
        destination: /index.html
