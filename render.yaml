services:
  # 1. Spring Boot Backend Web Service (Render uses env: docker or image for Java 17 Spring Boot)
  - type: web
    name: blood-donation-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/test
    autoDeploy: true

  # 2. React Vite Frontend Static Site (type: web with runtime: static, no region required)
  - type: web
    name: blood-donation-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: blood-donation-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
